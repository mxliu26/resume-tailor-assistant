<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#69806c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#faf7f2"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#2f2a26"><text x="32" y="49" font-size="30" fill="#314a38" font-weight="600">从真实经历，到可核对的岗位版本</text><text x="33" y="83" font-size="17" fill="#7a746c" font-weight="400">五步主流程 · 用户始终决定事实与最终表达</text><rect x="32" y="118" width="216" height="160" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><rect x="50" y="136" width="30" height="30" rx="9" fill="#e6eddf"/><text x="58" y="158" font-size="16" fill="#516e56" font-weight="600">1</text><text x="50" y="194" font-size="20" fill="#314a38" font-weight="600">材料输入</text><text x="50" y="226" font-size="16" fill="#675f56" font-weight="400">简历文本或 PDF</text><text x="50" y="251" font-size="16" fill="#675f56" font-weight="400">目标岗位 JD</text><path d="M251 198 L268 198" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="272" y="118" width="216" height="160" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><rect x="290" y="136" width="30" height="30" rx="9" fill="#e6eddf"/><text x="298" y="158" font-size="16" fill="#516e56" font-weight="600">2</text><text x="290" y="194" font-size="20" fill="#314a38" font-weight="600">解析校对</text><text x="290" y="226" font-size="16" fill="#675f56" font-weight="400">检查经历、日期与要求</text><text x="290" y="251" font-size="16" fill="#675f56" font-weight="400">纠正后明确确认</text><path d="M491 198 L508 198" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="512" y="118" width="216" height="160" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><rect x="530" y="136" width="30" height="30" rx="9" fill="#e6eddf"/><text x="538" y="158" font-size="16" fill="#516e56" font-weight="600">3</text><text x="530" y="194" font-size="20" fill="#314a38" font-weight="600">对照与补问</text><text x="530" y="226" font-size="16" fill="#675f56" font-weight="400">查看真实经历关联</text><text x="530" y="251" font-size="16" fill="#675f56" font-weight="400">补问、确认与选范围</text><path d="M731 198 L748 198" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="752" y="118" width="216" height="160" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><rect x="770" y="136" width="30" height="30" rx="9" fill="#e6eddf"/><text x="778" y="158" font-size="16" fill="#516e56" font-weight="600">4</text><text x="770" y="194" font-size="20" fill="#314a38" font-weight="600">改写核对</text><text x="770" y="226" font-size="16" fill="#675f56" font-weight="400">原文、建议与依据并列</text><text x="770" y="251" font-size="16" fill="#675f56" font-weight="400">编辑、采用或保留</text><path d="M971 198 L988 198" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="992" y="118" width="216" height="160" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><rect x="1010" y="136" width="30" height="30" rx="9" fill="#e6eddf"/><text x="1018" y="158" font-size="16" fill="#516e56" font-weight="600">5</text><text x="1010" y="194" font-size="20" fill="#314a38" font-weight="600">岗位版本</text><text x="1010" y="226" font-size="16" fill="#675f56" font-weight="400">确认保存与复制</text><text x="1010" y="251" font-size="16" fill="#675f56" font-weight="400">重开或复用素材</text><rect x="32" y="332" width="360" height="148" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="50" y="363" font-size="20" fill="#314a38" font-weight="600">保留材料与来源</text><text x="50" y="393" font-size="16" fill="#675f56" font-weight="400">原始输入与校对结果分别保留。</text><text x="50" y="418" font-size="16" fill="#675f56" font-weight="400">经历有独立来源，事实不跨经历迁移。</text><text x="50" y="443" font-size="16" fill="#675f56" font-weight="400">材料变化后重新核对相关结果。</text><rect x="430" y="332" width="360" height="196" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="448" y="363" font-size="20" fill="#314a38" font-weight="600">补问不是固定问卷</text><text x="448" y="393" font-size="16" fill="#675f56" font-weight="400">已有足够事实：直接继续。</text><text x="448" y="418" font-size="16" fill="#675f56" font-weight="400">需要补充：回答后核对事实摘要。</text><text x="448" y="443" font-size="16" fill="#675f56" font-weight="400">只有明确确认的补充可用于改写。</text><text x="448" y="468" font-size="16" fill="#675f56" font-weight="400">未知、未做过、跳过或冲突保留状态。</text><rect x="828" y="332" width="380" height="148" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="846" y="363" font-size="20" fill="#314a38" font-weight="600">保留用户的选择</text><text x="846" y="393" font-size="16" fill="#675f56" font-weight="400">未选中内容默认保留。</text><text x="846" y="418" font-size="16" fill="#675f56" font-weight="400">原文合适时，无需强制改写。</text><text x="846" y="443" font-size="16" fill="#675f56" font-weight="400">核对后保存，仍可重新打开。</text><path d="M620 278 L620 319" fill="none" stroke="#9b927f" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="33" y="581" font-size="15" fill="#7a746c" font-weight="400">流程节点表示产品操作与规则，不代表每次模型输出都自动通过事实核查。</text></g></svg>
