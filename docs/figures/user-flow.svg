<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-label="User flow for ResumeTailor"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#69806c" stroke-width="1.5" /></marker></defs><rect width="100%" height="100%" fill="#faf7f2" /><g font-family="Arial, Helvetica, sans-serif" fill="#2f2a26"><text x="32" y="49" font-size="30" fill="#314a38" font-weight="600">Real experience, tailored and reviewable</text><text x="33" y="83" font-size="17" fill="#7a746c" font-weight="400">Five steps. The user confirms the facts and chooses the final wording.</text><rect x="32" y="118" width="216" height="160" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><rect x="50" y="136" width="30" height="30" rx="9" fill="#e6eddf" /><text x="58" y="158" font-size="16" fill="#516e56" font-weight="600">1</text><text x="50" y="194" font-size="20" fill="#314a38" font-weight="600">Add materials</text><text x="50" y="226" font-size="16" fill="#675f56" font-weight="400">Resume text or PDF</text><text x="50" y="251" font-size="16" fill="#675f56" font-weight="400">Target job description</text><path d="M251 198 L268 198" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="272" y="118" width="216" height="160" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><rect x="290" y="136" width="30" height="30" rx="9" fill="#e6eddf" /><text x="298" y="158" font-size="16" fill="#516e56" font-weight="600">2</text><text x="290" y="194" font-size="20" fill="#314a38" font-weight="600">Review parsing</text><text x="290" y="226" font-size="16" fill="#675f56" font-weight="400">Check work, dates, JD</text><text x="290" y="251" font-size="16" fill="#675f56" font-weight="400">Correct, then confirm</text><path d="M491 198 L508 198" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="512" y="118" width="216" height="160" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><rect x="530" y="136" width="30" height="30" rx="9" fill="#e6eddf" /><text x="538" y="158" font-size="16" fill="#516e56" font-weight="600">3</text><text x="530" y="194" font-size="20" fill="#314a38" font-weight="600">Match &amp; clarify</text><text x="530" y="226" font-size="16" fill="#675f56" font-weight="400">Evidence for each match</text><text x="530" y="251" font-size="16" fill="#675f56" font-weight="400">Answer, confirm, select</text><path d="M731 198 L748 198" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="752" y="118" width="216" height="160" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><rect x="770" y="136" width="30" height="30" rx="9" fill="#e6eddf" /><text x="778" y="158" font-size="16" fill="#516e56" font-weight="600">4</text><text x="770" y="194" font-size="20" fill="#314a38" font-weight="600">Review rewrites</text><text x="770" y="226" font-size="16" fill="#675f56" font-weight="400">Compare text &amp; sources</text><text x="770" y="251" font-size="16" fill="#675f56" font-weight="400">Edit, accept, or keep</text><path d="M971 198 L988 198" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="992" y="118" width="216" height="160" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><rect x="1010" y="136" width="30" height="30" rx="9" fill="#e6eddf" /><text x="1018" y="158" font-size="16" fill="#516e56" font-weight="600">5</text><text x="1010" y="194" font-size="20" fill="#314a38" font-weight="600">Save a version</text><text x="1010" y="226" font-size="16" fill="#675f56" font-weight="400">Confirm, save, and copy</text><text x="1010" y="251" font-size="16" fill="#675f56" font-weight="400">Reopen or reuse material</text><rect x="32" y="332" width="360" height="148" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="50" y="363" font-size="20" fill="#314a38" font-weight="600">Preserve sources</text><text x="50" y="393" font-size="15" fill="#675f56" font-weight="400">Keep original and reviewed text separate.</text><text x="50" y="418" font-size="15" fill="#675f56" font-weight="400">Keep facts within their own experience.</text><text x="50" y="443" font-size="15" fill="#675f56" font-weight="400">Recheck results after material changes.</text><rect x="430" y="332" width="360" height="196" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="448" y="363" font-size="20" fill="#314a38" font-weight="600">Ask only when needed</text><text x="448" y="393" font-size="15" fill="#675f56" font-weight="400">Enough facts: continue without questions.</text><text x="448" y="418" font-size="15" fill="#675f56" font-weight="400">If needed, answer and review the facts.</text><text x="448" y="443" font-size="15" fill="#675f56" font-weight="400">Only confirmed additions support rewriting.</text><text x="448" y="468" font-size="15" fill="#675f56" font-weight="400">Preserve unknown, not-done, skip, conflict.</text><rect x="828" y="332" width="380" height="148" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="846" y="363" font-size="20" fill="#314a38" font-weight="600">Keep the user in control</text><text x="846" y="393" font-size="15" fill="#675f56" font-weight="400">Unselected content stays unchanged.</text><text x="846" y="418" font-size="15" fill="#675f56" font-weight="400">Keep the original when it already fits.</text><text x="846" y="443" font-size="15" fill="#675f56" font-weight="400">Review, save, and reopen later.</text><path d="M620 278 L620 319" fill="none" stroke="#9b927f" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)" /><text x="33" y="581" font-size="15" fill="#7a746c" font-weight="400">These steps describe product rules; every model response still needs factual review.</text></g></svg>
