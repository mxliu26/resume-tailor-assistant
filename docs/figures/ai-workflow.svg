<svg xmlns="http://www.w3.org/2000/svg" width="1252" height="950" viewBox="0 0 1252 950" role="img" aria-label="AI workflow and fact confirmation for ResumeTailor"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#69806c" stroke-width="1.5" /></marker></defs><rect width="100%" height="100%" fill="#faf7f2" /><g font-family="Arial, Helvetica, sans-serif" fill="#2f2a26"><text x="32" y="48" font-size="30" fill="#314a38" font-weight="600">AI workflow and fact confirmation</text><text x="33" y="82" font-size="17" fill="#7a746c" font-weight="400">Three model tasks, program validation, and user confirmation</text><text x="44" y="122" font-size="17" fill="#516e56" font-weight="600">User input / confirmation</text><text x="349" y="122" font-size="17" fill="#516e56" font-weight="600">Backend context assembly</text><text x="654" y="122" font-size="17" fill="#516e56" font-weight="600">DeepSeek · v21</text><text x="959" y="122" font-size="17" fill="#516e56" font-weight="600">Validate and return to user</text><text x="34" y="138" font-size="15" fill="#9c754c" font-weight="600">01  Parsing</text><rect x="32" y="150" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="50" y="181" font-size="19" fill="#314a38" font-weight="600">Material input</text><text x="50" y="211" font-size="15" fill="#675f56" font-weight="400">Resume text / PDF and JD</text><text x="50" y="236" font-size="15" fill="#675f56" font-weight="400">Keep original materials</text><path d="M310 216 L328 216" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="337" y="150" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="355" y="181" font-size="19" fill="#314a38" font-weight="600">Read and prepare</text><text x="355" y="211" font-size="15" fill="#675f56" font-weight="400">Extract PDF text locally</text><text x="355" y="236" font-size="15" fill="#675f56" font-weight="400">De-identify, then build request</text><path d="M615 216 L633 216" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="642" y="150" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="660" y="181" font-size="19" fill="#314a38" font-weight="600">Structured parsing</text><text x="660" y="211" font-size="15" fill="#675f56" font-weight="400">Return units and requirements</text><text x="660" y="236" font-size="15" fill="#675f56" font-weight="400">Keep original source spans</text><path d="M920 216 L938 216" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="947" y="150" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="965" y="181" font-size="19" fill="#314a38" font-weight="600">Validate and review</text><text x="965" y="211" font-size="15" fill="#675f56" font-weight="400">Check structure and boundaries</text><text x="965" y="236" font-size="15" fill="#675f56" font-weight="400">User corrects, then confirms</text><text x="34" y="342" font-size="15" fill="#9c754c" font-weight="600">02  Matching and follow-ups</text><rect x="32" y="354" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="50" y="385" font-size="19" fill="#314a38" font-weight="600">Reviewed materials</text><text x="50" y="415" font-size="15" fill="#675f56" font-weight="400">Experiences, conditions, states</text><text x="50" y="440" font-size="15" fill="#675f56" font-weight="400">User can adjust associations</text><path d="M310 420 L328 420" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="337" y="354" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="355" y="385" font-size="19" fill="#314a38" font-weight="600">Constrain context</text><text x="355" y="415" font-size="15" fill="#675f56" font-weight="400">Separate experience / conditions</text><text x="355" y="440" font-size="15" fill="#675f56" font-weight="400">Include answers and confirmations</text><path d="M615 420 L633 420" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="642" y="354" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="660" y="385" font-size="19" fill="#314a38" font-weight="600">Match and ask</text><text x="660" y="415" font-size="15" fill="#675f56" font-weight="400">Propose evidence and judgments</text><text x="660" y="440" font-size="15" fill="#675f56" font-weight="400">Ask only about eligible gaps</text><path d="M920 420 L938 420" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="947" y="354" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="965" y="385" font-size="19" fill="#314a38" font-weight="600">Check sources and state</text><text x="965" y="415" font-size="15" fill="#675f56" font-weight="400">User answers, skips, or confirms</text><text x="965" y="440" font-size="15" fill="#675f56" font-weight="400">Refresh matches after confirmation</text><text x="34" y="546" font-size="15" fill="#9c754c" font-weight="600">03  Per-experience rewriting</text><rect x="32" y="558" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="50" y="589" font-size="19" fill="#314a38" font-weight="600">Choose rewrite scope</text><text x="50" y="619" font-size="15" fill="#675f56" font-weight="400">Selected units and current version</text><text x="50" y="644" font-size="15" fill="#675f56" font-weight="400">Keep unselected content</text><path d="M310 624 L328 624" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="337" y="558" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="355" y="589" font-size="19" fill="#314a38" font-weight="600">Facts by experience</text><text x="355" y="619" font-size="15" fill="#675f56" font-weight="400">Original text for this unit</text><text x="355" y="644" font-size="15" fill="#675f56" font-weight="400">Confirmed additions for this unit</text><path d="M615 624 L633 624" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="642" y="558" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="660" y="589" font-size="19" fill="#314a38" font-weight="600">Draft suggestions</text><text x="660" y="619" font-size="15" fill="#675f56" font-weight="400">Adjust emphasis and wording</text><text x="660" y="644" font-size="15" fill="#675f56" font-weight="400">Return sources and explanations</text><path d="M920 624 L938 624" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="947" y="558" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="965" y="589" font-size="19" fill="#314a38" font-weight="600">Protect facts and review</text><text x="965" y="619" font-size="15" fill="#675f56" font-weight="400">Check sources, numbers, and roles</text><text x="965" y="644" font-size="15" fill="#675f56" font-weight="400">User edits, accepts, or keeps text</text><path d="M1082 487 L1082 517 L463 517 L463 497" fill="none" stroke="#9b927f" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)" /><text x="544" y="540" font-size="14" fill="#7a746c" font-weight="400">Confirmed answers can trigger updated matching</text><rect x="32" y="752" width="576" height="116" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="50" y="783" font-size="19" fill="#314a38" font-weight="600">Local storage</text><text x="50" y="813" font-size="16" fill="#675f56" font-weight="400">Tasks, facts, and role-specific versions stay in this browser.</text><text x="50" y="838" font-size="16" fill="#675f56" font-weight="400">Original PDFs are stored in IndexedDB.</text><rect x="642" y="752" width="577" height="116" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5" /><text x="660" y="783" font-size="19" fill="#314a38" font-weight="600">Failure handling</text><text x="660" y="813" font-size="16" fill="#675f56" font-weight="400">Failed request or validation: preserve existing content.</text><text x="660" y="838" font-size="16" fill="#675f56" font-weight="400">Users choose retry or keep; never silently adopt failed output.</text><text x="33" y="915" font-size="15" fill="#7a746c" font-weight="400">Only generation steps call the model. Ordinary editing, copying, and saving do not.</text></g></svg>
