<svg xmlns="http://www.w3.org/2000/svg" width="1252" height="950" viewBox="0 0 1252 950" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#69806c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#faf7f2"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#2f2a26"><text x="32" y="48" font-size="30" fill="#314a38" font-weight="600">AI 工作流与事实确认边界</text><text x="33" y="82" font-size="17" fill="#7a746c" font-weight="400">三个模型任务 · 程序校验 · 用户确认</text><text x="44" y="122" font-size="18" fill="#516e56" font-weight="600">用户提供或确认</text><text x="349" y="122" font-size="18" fill="#516e56" font-weight="600">后端组装与处理</text><text x="654" y="122" font-size="18" fill="#516e56" font-weight="600">DeepSeek · v21</text><text x="959" y="122" font-size="18" fill="#516e56" font-weight="600">校验后交还用户</text><text x="34" y="138" font-size="15" fill="#9c754c" font-weight="600">01 解析</text><rect x="32" y="150" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="50" y="181" font-size="20" fill="#314a38" font-weight="600">材料输入</text><text x="50" y="211" font-size="16" fill="#675f56" font-weight="400">简历 / PDF 与 JD</text><text x="50" y="236" font-size="16" fill="#675f56" font-weight="400">原始材料保留</text><path d="M310 216 L328 216" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="337" y="150" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="355" y="181" font-size="20" fill="#314a38" font-weight="600">读取与组装</text><text x="355" y="211" font-size="16" fill="#675f56" font-weight="400">PDF 本机提取文字</text><text x="355" y="236" font-size="16" fill="#675f56" font-weight="400">脱敏后构造解析请求</text><path d="M615 216 L633 216" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="150" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="660" y="181" font-size="20" fill="#314a38" font-weight="600">结构化解析</text><text x="660" y="211" font-size="16" fill="#675f56" font-weight="400">返回经历、要求等结构</text><text x="660" y="236" font-size="16" fill="#675f56" font-weight="400">保留原文来源范围</text><path d="M920 216 L938 216" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="947" y="150" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="965" y="181" font-size="20" fill="#314a38" font-weight="600">解析校验与校对</text><text x="965" y="211" font-size="16" fill="#675f56" font-weight="400">检查结构与经历边界</text><text x="965" y="236" font-size="16" fill="#675f56" font-weight="400">用户纠正后确认</text><text x="34" y="342" font-size="15" fill="#9c754c" font-weight="600">02 关联与补问</text><rect x="32" y="354" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="50" y="385" font-size="20" fill="#314a38" font-weight="600">确认后的材料</text><text x="50" y="415" font-size="16" fill="#675f56" font-weight="400">经历、条件和已有状态</text><text x="50" y="440" font-size="16" fill="#675f56" font-weight="400">允许用户调整关联</text><path d="M310 420 L328 420" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="337" y="354" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="355" y="385" font-size="20" fill="#314a38" font-weight="600">限定可用上下文</text><text x="355" y="415" font-size="16" fill="#675f56" font-weight="400">区分经历与条件来源</text><text x="355" y="440" font-size="16" fill="#675f56" font-weight="400">提供回答和确认状态</text><path d="M615 420 L633 420" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="354" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="660" y="385" font-size="20" fill="#314a38" font-weight="600">关联与必要补问</text><text x="660" y="415" font-size="16" fill="#675f56" font-weight="400">提出依据和判断</text><text x="660" y="440" font-size="16" fill="#675f56" font-weight="400">只针对合法缺口提问</text><path d="M920 420 L938 420" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="947" y="354" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="965" y="385" font-size="20" fill="#314a38" font-weight="600">来源与状态校验</text><text x="965" y="415" font-size="16" fill="#675f56" font-weight="400">用户回答、跳过或确认</text><text x="965" y="440" font-size="16" fill="#675f56" font-weight="400">确认后可再次关联</text><text x="34" y="546" font-size="15" fill="#9c754c" font-weight="600">03 逐条改写</text><rect x="32" y="558" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="50" y="589" font-size="20" fill="#314a38" font-weight="600">确定改写范围</text><text x="50" y="619" font-size="16" fill="#675f56" font-weight="400">所选经历及当前版本</text><text x="50" y="644" font-size="16" fill="#675f56" font-weight="400">未选内容保留</text><path d="M310 624 L328 624" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="337" y="558" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="355" y="589" font-size="20" fill="#314a38" font-weight="600">按经历提供事实</text><text x="355" y="619" font-size="16" fill="#675f56" font-weight="400">本经历原文</text><text x="355" y="644" font-size="16" fill="#675f56" font-weight="400">本经历已确认补充</text><path d="M615 624 L633 624" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="558" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="660" y="589" font-size="20" fill="#314a38" font-weight="600">生成表达候选</text><text x="660" y="619" font-size="16" fill="#675f56" font-weight="400">调整内容重点与表述</text><text x="660" y="644" font-size="16" fill="#675f56" font-weight="400">给出来源和修改理由</text><path d="M920 624 L938 624" fill="none" stroke="#69806c" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="947" y="558" width="272" height="132" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="965" y="589" font-size="20" fill="#314a38" font-weight="600">事实保护与核对</text><text x="965" y="619" font-size="16" fill="#675f56" font-weight="400">检查来源、数字与职责</text><text x="965" y="644" font-size="16" fill="#675f56" font-weight="400">用户编辑、采用或保留</text><path d="M1082 487 L1082 517 L463 517 L463 497" fill="none" stroke="#9b927f" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="544" y="540" font-size="14" fill="#7a746c" font-weight="400">补问确认后的状态可触发重新关联</text><rect x="32" y="752" width="576" height="116" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="50" y="783" font-size="20" fill="#314a38" font-weight="600">保存位置</text><text x="50" y="813" font-size="16" fill="#675f56" font-weight="400">任务、事实和岗位版本保存在浏览器本机。</text><text x="50" y="838" font-size="16" fill="#675f56" font-weight="400">PDF 原件使用浏览器 IndexedDB。</text><rect x="642" y="752" width="577" height="116" rx="15" fill="#fffdfc" stroke="#d8ded2" stroke-width="1.5"/><text x="660" y="783" font-size="20" fill="#314a38" font-weight="600">失败处理</text><text x="660" y="813" font-size="16" fill="#675f56" font-weight="400">请求失败或校验不通过：保留现有内容。</text><text x="660" y="838" font-size="16" fill="#675f56" font-weight="400">由用户决定重试或保留原文，不静默采用失败结果。</text><text x="33" y="915" font-size="15" fill="#7a746c" font-weight="400">模型调用只发生在需生成的步骤；普通编辑、复制与保存不触发模型调用。</text></g></svg>
